<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abdu Pay Verify</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #0f1115);
    color: var(--tg-theme-text-color, #ffffff);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .icon {
    font-size: 56px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    opacity: 0.7;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(127,127,127,0.25);
    border-top-color: var(--tg-theme-button-color, #2ea6ff);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .status.ok { color: #2ecc71; }
  .status.fail { color: #e74c3c; }
  button {
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    margin-top: 8px;
    cursor: pointer;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <div id="loading">
    <div class="spinner"></div>
    <div class="status">በማረጋገጥ ላይ...</div>
    <p>እባክዎ ትንሽ ይጠብቁ፣ አካውንትዎን በማረጋገጥ ላይ ነን።</p>
  </div>

  <div id="resultOk" class="hidden">
    <div class="icon">✅</div>
    <div class="status ok">ማረጋገጫ ተሳክቷል!</div>
    <p>ወደ ቻቱ ተመልሰው መቀጠል ይችላሉ።</p>
    <button onclick="closeApp()">ዝጋ / Continue</button>
  </div>

  <div id="resultFail" class="hidden">
    <div class="icon">🚫</div>
    <div class="status fail">ማረጋገጫ አልተሳካም</div>
    <p id="failReason">VPN ወይም ብዙ አካውንት ተገኝቷል።</p>
    <button onclick="closeApp()">ዝጋ / Close</button>
  </div>

  <div id="resultError" class="hidden">
    <div class="icon">⚠️</div>
    <div class="status fail">ችግር ተፈጥሯል</div>
    <p>እባክዎ ቻቱ ውስጥ /start በመላክ እንደገና ይሞክሩ።</p>
    <button onclick="closeApp()">ዝጋ / Close</button>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function closeApp() {
  if (tg) { tg.close(); } else { window.close(); }
}

function show(id) {
  ["loading", "resultOk", "resultFail", "resultError"].forEach(function (x) {
    document.getElementById(x).classList.toggle("hidden", x !== id);
  });
}

// --- Read parameters passed from the bot's Verify button ---
// The bot builds the URL as: MINI_APP_URL + "?uid=" + u + "&cb=" + encodeURIComponent(webhookUrl)
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");
const callbackUrl = params.get("cb");

// --- Build a lightweight device fingerprint ---
// NOTE: this is a best-effort heuristic (canvas + WebGL + hardware signals),
// not a guaranteed multi-account/VPN block. A determined user can still get
// around it. Combined with server-side IP proxy/hosting checks, it raises
// the bar for casual farming without pretending to be bulletproof.
function canvasFingerprint() {
  try {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillText("abdu-pay-fp-" + navigator.userAgent, 2, 2);
    return c.toDataURL();
  } catch (e) {
    return "no-canvas";
  }
}

function webglFingerprint() {
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (!gl) return "no-webgl";
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    if (!dbg) return "no-debug-info";
    return gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) + "|" + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
  } catch (e) {
    return "no-webgl";
  }
}

async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(function (b) {
    return b.toString(16).padStart(2, "0");
  }).join("");
}

async function buildFingerprint() {
  const raw = [
    navigator.userAgent,
    navigator.language,
    navigator.hardwareConcurrency,
    screen.width + "x" + screen.height + "x" + screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    canvasFingerprint(),
    webglFingerprint()
  ].join("::");
  return await sha256(raw);
}

async function verify() {
  if (!callbackUrl) {
    show("resultError");
    return;
  }
  try {
    const fp = await buildFingerprint();
    const res = await fetch(decodeURIComponent(callbackUrl), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fp: fp,
        uid: uid,
        initData: tg ? tg.initData : ""
      })
    });
    const data = await res.json();
    if (data && data.passed) {
      show("resultOk");
    } else {
      document.getElementById("failReason").textContent =
        (data && data.reason === "VPN/Proxy")
          ? "VPN ወይም Proxy ተገኝቷል። VPN ን አጥፍተው ይሞክሩ።"
          : "ይህ መሳሪያ ቀድሞ በሌላ አካውንት ተመዝግቧል።";
      show("resultFail");
    }
  } catch (e) {
    show("resultError");
  }
}

verify();
</script>

</body>
</html>
